<!DOCTYPE html>
<html>
<head>
    <title>Student Website</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input { display: block; margin: 6px 0; padding: 8px; width: 260px; }
        button { margin-top: 10px; padding: 8px 16px; }
        table { border-collapse: collapse; margin-top: 24px; width: 90%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2>Student Portal</h2>
    <form method="POST">
        <input type="text" name="usn" placeholder="USN" required>
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="branch" placeholder="Branch" required>
        <input type="number" name="age" placeholder="Age" required>
        <input type="text" name="ph_no" placeholder="Phone Number" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="number" name="semester" placeholder="Semester" required>
        <input type="text" name="section" placeholder="Section" required>
        <input type="number" name="dept_id" placeholder="Dept ID (e.g. 101)" required>
        <button type="submit">Add Student</button>
    </form>

    <table>
        <tr>
            <th>USN</th><th>Name</th><th>Branch</th><th>Age</th><th>Phone</th><th>Email</th><th>Sem</th><th>Sec</th><th>Dept ID</th>
        </tr>
        {% for r in rows %}
        <tr>
            <td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td>
            <td>{{ r[3] }}</td><td>{{ r[4] }}</td><td>{{ r[5] }}</td>
            <td>{{ r[6] }}</td><td>{{ r[7] }}</td><td>{{ r[8] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
