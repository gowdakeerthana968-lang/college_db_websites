<!DOCTYPE html>
<html>
<head>
    <title>Department Website</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input { display: block; margin: 6px 0; padding: 8px; width: 260px; }
        button { margin-top: 10px; padding: 8px 16px; }
        table { border-collapse: collapse; margin-top: 24px; width: 70%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2>Department Portal</h2>
    <form method="POST">
        <input type="number" name="dept_id" placeholder="Dept ID (e.g. 101)" required>
        <input type="text" name="dept_name" placeholder="Dept Name (e.g. CSE)" required>
        <input type="text" name="hod" placeholder="HOD Name" required>
        <input type="email" name="hod_email" placeholder="HOD Email" required>
        <button type="submit">Add Department</button>
    </form>

    <table>
        <tr>
            <th>Dept ID</th><th>Dept Name</th><th>HOD</th><th>HOD Email</th>
        </tr>
        {% for r in rows %}
        <tr>
            <td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ r[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
